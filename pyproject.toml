[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-quality-orchestrator"
version = "0.1.0"
description = "Orquestrador de automação de qualidade para APIs (CLI), idealizado, arquitetado e mantido por Crystiane Mello"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Crystiane Mello" }]
maintainers = [{ name = "Crystiane Mello" }]
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/CrysMello"
LinkedIn = "https://www.linkedin.com/in/crystianemello/"

[project.scripts]
api-quality-orchestrator = "api_quality_agent.cli.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Política inicial (2026-08-04, formalização do ruff como ferramenta oficial
# do projeto): mantém o conjunto de regras padrão do ruff, mas ignora o que
# já era comum no código antes de existir lint automatizado — nenhuma dessas
# regras foi corrigida nesta etapa (fora de escopo da baseline; ver
# tests/characterization/README.md). F401/F841 (imports/variáveis não
# usados) são os melhores candidatos a uma limpeza futura rápida, por não
# serem só estilo. Remover itens desta lista conforme o código for ajustado.
ignore = [
    "I001",    # unsorted-imports
    "ISC004",  # implicit-string-concatenation-in-collection-literal
    "F401",    # unused-import
    "RUF100",  # unused-noqa
    "C408",    # unnecessary-collection-call
    "DTZ005",  # call-datetime-now-without-tzinfo
    "BLE001",  # blind-except
    "PLW1510", # subprocess-run-without-check
    "UP037",   # quoted-annotation
    "SIM118",  # in-dict-keys
    "DTZ001",  # call-datetime-without-tzinfo
    "DTZ007",  # call-datetime-strptime-without-zone
    "F841",    # unused-variable
    "PIE810",  # multiple-starts-ends-with
    "RUF023",  # unsorted-dunder-slots
    "RUF059",  # unused-unpacked-variable
    "UP017",   # datetime-timezone-utc
]
